[package]
name = "midi-jar"
version = "2.0.0"
description = "MIDI-JAR - A MIDI tool application"
authors = ["you"]
edition = "2024"

[lib]
name = "midi_jar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
midir = "=0.11.0"
regex = "1.13.1"
log = "0.4.33"
# cpal 0.18 起 Windows 上 COM 接口包在 `SendWrapper` 里，`cpal::Stream` 是 `Send`；
# vst3-host 的默认 feature 把 `cpal::Stream` 藏进 `Box<dyn AudioStream>`（无 `Send`
# bound），导致 `AudioHandle` 被判为 `!Send`。直接依赖同一版本，用
# `downcast::<CpalStream>()` 把具体类型取回来，就能把音频句柄移进专用的音频线程。
cpal = "0.18"
vst3-host = "0.9.0"
