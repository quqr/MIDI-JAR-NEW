[package]
name = "midi-jar"
version = "2.0.0"
description = "MIDI-JAR - A MIDI tool application"
authors = ["you"]
edition = "2024"

[lib]
name = "midi_jar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "=0.11.0"
regex = "1"
