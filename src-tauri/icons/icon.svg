<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 极淡流体：两团柔和色晕，边缘透明 -->
    <radialGradient id="glowIndigo" cx="30%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="78%" cy="30%" r="58%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- 瀑布流泛光 / 发光 -->
    <filter id="bloom" x="-90%" y="-40%" width="280%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 音符符号：符头(椭圆) + 符干(矩形) + 符尾(旗) 同色，整组统一倾斜 -18°；符干左缘 x=1.0、底部 y=0.5 均深探入符头，确保重叠无缝 -->
    <g id="note" transform="rotate(-18)">
      <ellipse cx="0" cy="0" rx="2.4" ry="1.7"/>
      <rect x="1.0" y="-11" width="0.8" height="11.5"/>
      <path d="M1.8 -11 C 4.3 -10.4 4.6 -7.2 2.8 -6.3 C 3.6 -8.2 2.5 -9.6 1.8 -9.7 Z"/>
    </g>
    <g id="notebeam" transform="rotate(-18)">
      <ellipse cx="0" cy="0" rx="2.4" ry="1.7"/>
      <ellipse cx="9" cy="0" rx="2.4" ry="1.7"/>
      <rect x="1.0" y="-11" width="0.8" height="11.5"/>
      <rect x="10.0" y="-11" width="0.8" height="11.5"/>
      <rect x="1.0" y="-11" width="9.8" height="1.9"/>
    </g>

    <clipPath id="rounded">
      <rect x="4" y="4" width="120" height="120" rx="26" ry="26"/>
    </clipPath>
  </defs>

  <!-- 背景：扁平深色底 -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="#0e1730"/>

  <!-- 背景：色晕 + 流动曲线 + 音符（统一朝向） -->
  <g clip-path="url(#rounded)">
    <!-- 柔和色晕 -->
    <rect x="4" y="4" width="120" height="120" fill="url(#glowIndigo)"/>
    <rect x="4" y="4" width="120" height="120" fill="url(#glowTeal)"/>

    <!-- 流动曲线 / 线条 -->
    <path d="M8 64 C 30 46, 48 72, 70 54 S 104 58, 120 44" fill="none" stroke="#14b8a6" stroke-opacity="0.16" stroke-width="1" stroke-linecap="round"/>
    <path d="M12 42 C 34 30, 52 52, 74 38 S 106 44, 120 30" fill="none" stroke="#6366f1" stroke-opacity="0.14" stroke-width="1" stroke-linecap="round"/>

    <!-- 音符（统一朝向，仅位置/大小/颜色不同） -->
    <use href="#note"     transform="translate(26,32) scale(1.5)"  fill="#6366f1" opacity="0.42"/>
    <use href="#note"     transform="translate(98,22) scale(1.4)"  fill="#14b8a6" opacity="0.4"/>
    <use href="#notebeam" transform="translate(54,46) scale(1.15)" fill="#14b8a6" opacity="0.34"/>
    <use href="#note"     transform="translate(18,58) scale(1.2)"  fill="#14b8a6" opacity="0.32"/>
    <use href="#note"     transform="translate(112,48) scale(1.25)" fill="#6366f1" opacity="0.34"/>
    <use href="#note"     transform="translate(66,18) scale(1.0)"  fill="#6366f1" opacity="0.3"/>
  </g>

  <!-- 瀑布音符流：扁平实色条 + 泛光发光 -->
  <g clip-path="url(#rounded)" filter="url(#bloom)">
    <rect x="15.5" y="16" width="7" height="66" rx="3.5" fill="#6366f1"/>
    <rect x="37"   y="24" width="7" height="58" rx="3.5" fill="#14b8a6"/>
    <rect x="74"   y="14" width="7" height="68" rx="3.5" fill="#14b8a6"/>
    <rect x="104.5" y="26" width="7" height="56" rx="3.5" fill="#6366f1"/>
  </g>

  <!-- 音符水滴圆点 -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="19"   cy="22" r="2"/>
    <circle cx="19"   cy="42" r="1.6"/>
    <circle cx="40.5" cy="30" r="1.8"/>
    <circle cx="40.5" cy="46" r="1.4"/>
    <circle cx="77.5" cy="20" r="2"/>
    <circle cx="77.5" cy="38" r="1.5"/>
    <circle cx="108"  cy="32" r="1.8"/>
    <circle cx="108"  cy="48" r="1.4"/>
  </g>

  <!-- 钢琴：琴键直接漂浮，无琴身 / 无边框 / 无投影 -->
  <g clip-path="url(#rounded)">
    <!-- 白键（7 键，键间留缝，扁平实色） -->
    <g fill="#f1f5f9">
      <rect x="11"  y="88" width="14" height="30" rx="2"/>
      <rect x="26"  y="88" width="14" height="30" rx="2"/>
      <rect x="41"  y="88" width="14" height="30" rx="2"/>
      <rect x="56"  y="88" width="14" height="30" rx="2"/>
      <rect x="71"  y="88" width="14" height="30" rx="2"/>
      <rect x="86"  y="88" width="14" height="30" rx="2"/>
      <rect x="101" y="88" width="14" height="30" rx="2"/>
    </g>

    <!-- 黑键（2+3 分组，E-F 与 B-C 处留白，扁平实色） -->
    <g fill="#1e293b">
      <rect x="21" y="88" width="9" height="18" rx="2"/>
      <rect x="36" y="88" width="9" height="18" rx="2"/>
      <rect x="66" y="88" width="9" height="18" rx="2"/>
      <rect x="81" y="88" width="9" height="18" rx="2"/>
      <rect x="96" y="88" width="9" height="18" rx="2"/>
    </g>
  </g>
</svg>
