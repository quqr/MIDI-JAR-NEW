      /*
 * Pinguo design tokens — project-local supplement
 * Source: Apple Design Library (dl_builtin_apple) colors_and_type.css
 * Supplement: semantic radius/shadow/spacing aliases for apply-html-head-contract.mjs
 * The Library CSS is read-only; this file extends it with required semantic aliases.
 * All primitive and semantic tokens are inherited from the Library source below.

      :root {
        /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
        --apple-background: var(--background, #ffffff);
        --apple-foreground: var(--foreground, #0f172a);
        --apple-card: var(--card, var(--background));
        --apple-card-foreground: var(--card-foreground, var(--foreground));
        --apple-popover: var(--popover, var(--card));
        --apple-popover-foreground: var(
          --popover-foreground,
          var(--card-foreground, var(--foreground))
        );
        --apple-primary: var(--primary, #111827);
        --apple-primary-foreground: var(--primary-foreground, #ffffff);
        --apple-secondary: var(--secondary, var(--muted, var(--card)));
        --apple-secondary-foreground: var(
          --secondary-foreground,
          var(--foreground)
        );
        --apple-muted: var(--muted, var(--card));
        --apple-muted-foreground: var(--muted-foreground, var(--foreground));
        --apple-accent: var(
          --accent,
          var(--secondary, var(--muted, var(--card)))
        );
        --apple-accent-foreground: var(--accent-foreground, var(--foreground));
        --apple-destructive: var(--destructive, #ef4444);
        --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
        --apple-border: var(--border, currentColor);
        --apple-input: var(--input, var(--border));
        --apple-ring: var(--ring, var(--primary));
        --apple-chart-1: var(--chart-1, var(--primary));
        --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
        --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
        --apple-chart-4: var(
          --chart-4,
          var(--muted-foreground, var(--foreground))
        );
        --apple-chart-5: var(--chart-5, var(--foreground));
        --apple-sidebar: var(--sidebar, var(--background));
        --apple-sidebar-foreground: var(
          --sidebar-foreground,
          var(--foreground)
        );
        --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
        --apple-sidebar-primary-foreground: var(
          --sidebar-primary-foreground,
          var(--primary-foreground)
        );
        --apple-sidebar-accent: var(
          --sidebar-accent,
          var(--accent, var(--muted, var(--card)))
        );
        --apple-sidebar-accent-foreground: var(
          --sidebar-accent-foreground,
          var(--accent-foreground, var(--foreground))
        );

        /* ===== PRIMITIVE PALETTE ===== */

        /* brand */
        --brand-50: #e8f2ff;
        --brand-100: #cfe5ff;
        --brand-200: #9fcbff;
        --brand-300: #66abff;
        --brand-400: #2e8dff;
        --brand-500: #007aff;
        --brand-600: #0064d6;
        --brand-700: #004fad;
        --brand-800: #003b82;
        --brand-900: #00275a;

        /* background */
        --background-50: #ffffff;
        --background-100: #f7f7fa;
        --background-200: #f2f2f7;
        --background-300: #e5e5ea;
        --background-400: #d1d1d6;
        --background-500: #aeaeb2;
        --background-600: #8e8e93;
        --background-700: #3a3a3c;
        --background-800: #1c1c1e;
        --background-900: #000000;

        /* text */
        --text-50: #f5f5f7;
        --text-100: #e3e3e8;
        --text-200: #c7c7cc;
        --text-300: #aeaeb2;
        --text-400: #8e8e93;
        --text-500: #6e6e73;
        --text-600: #48484a;
        --text-700: #3c3c43;
        --text-800: #1d1d1f;
        --text-900: #000000;

        /* icon */
        --icon-50: #f5f5f7;
        --icon-100: #e5e5ea;
        --icon-200: #d1d1d6;
        --icon-300: #c7c7cc;
        --icon-400: #aeaeb2;
        --icon-500: #8e8e93;
        --icon-600: #6e6e73;
        --icon-700: #48484a;
        --icon-800: #2c2c2e;
        --icon-900: #1d1d1f;

        /* state-success */
        --state-success: #34c759;
        --state-success-dark: #30d158;
        --state-success-surface: #e9f9ee;
        --state-success-foreground: #ffffff;

        /* state-error */
        --state-error: #ff3b30;
        --state-error-dark: #ff453a;
        --state-error-surface: #ffecea;
        --state-error-foreground: #ffffff;

        /* ===== SEMANTIC ROLES ===== */

        --background: var(--background-50);
        --foreground: var(--text-800);
        --card: var(--background-50);
        --card-foreground: var(--text-800);
        --popover: var(--background-50);
        --popover-foreground: var(--text-900);

        --primary: var(--brand-500);
        --primary-foreground: var(--background-50);
        --secondary: var(--background-200);
        --secondary-foreground: var(--text-800);
        --muted: var(--background-200);
        --muted-foreground: var(--text-400);
        --accent: var(--background-100);
        --accent-foreground: var(--text-800);
        --destructive: var(--state-error);
        --destructive-foreground: var(--state-error-foreground);
        --success: var(--state-success);
        --success-foreground: var(--state-success-foreground);
        --border: var(--background-300);
        --input: var(--background-400);
        --ring: var(--brand-500);

        --icon: var(--icon-900);
        --icon-muted: var(--icon-500);

        /* chart */
        --chart-1: var(--state-success);
        --chart-2: var(--brand-500);
        --chart-3: #ff9500;
        --chart-4: #5856d6;
        --chart-5: #af52de;

        /* sidebar */
        --sidebar: var(--background-200);
        --sidebar-foreground: var(--text-800);
        --sidebar-primary: var(--brand-500);
        --sidebar-primary-foreground: var(--background-50);
        --sidebar-accent: var(--background-300);
        --sidebar-accent-foreground: var(--text-800);
        --sidebar-border: var(--background-300);
        --sidebar-ring: var(--brand-500);

        /* TYPOGRAPHY */
        --font-sans: "DM Sans", ui-sans-serif, sans-serif, system-ui;
        --font-serif: "DM Sans", ui-sans-serif, sans-serif, system-ui;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --tracking-normal: 0em;

        /* RADIUS — Apple HIG continuous corner scale */
        --radius: 1.2rem;
        --apple-radius-sm: 0.5rem; /* 8px — inputs, labels, small controls */
        --apple-radius-md: 0.75rem; /* 12px — buttons, medium elements */
        --apple-radius-lg: 1.2rem; /* 19.2px — cards, containers (matches --radius) */
        --apple-radius-xl: 1.75rem; /* 28px — hero sections, large panels */
        --apple-radius-full: 9999px; /* pill-shaped buttons, avatars */

        /* SHADOWS — whisper-light elevation */
        --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04);
        --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
        --shadow-sm:
          0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
        --shadow:
          0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        --shadow-md:
          0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg:
          0 8px 24px -8px rgba(0, 0, 0, 0.08),
          0 4px 8px -4px rgba(0, 0, 0, 0.05);
        --shadow-xl:
          0 16px 40px -10px rgba(0, 0, 0, 0.1),
          0 8px 16px -8px rgba(0, 0, 0, 0.06);
        --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12);
        --apple-shadow-sm: var(--shadow-sm);
        --apple-shadow-md: var(--shadow-md);
        --apple-shadow-lg: var(--shadow-lg);
        --apple-shadow-xl: var(--shadow-xl);

        /* SPACING */
        --spacing: 0.24rem;
        --apple-spacing: var(--spacing);

        /* MOTION — Apple HIG easing and timing */
        --ease-hig-standard: cubic-bezier(0.32, 0.72, 0, 1);
        --ease-hig-decelerate: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ease-hig-accelerate: cubic-bezier(0.3, 0, 0.5, 1);
        --hig-duration-fast: 150ms;
        --hig-duration-normal: 250ms;
        --hig-duration-slow: 350ms;
        --apple-ease: var(--ease-hig-standard);
        --apple-duration-fast: var(--hig-duration-fast);
        --apple-duration-normal: var(--hig-duration-normal);
        --apple-duration-slow: var(--hig-duration-slow);

        /* STATUS COLORS — Apple HIG system colors */
        --hig-success: var(--state-success);
        --hig-warning: #ff9500;
        --hig-error: var(--state-error);
        --hig-info: var(--brand-500);
        --apple-success: var(--state-success);
        --apple-warning: #ff9500;
        --apple-error: var(--state-error);
        --apple-info: var(--brand-500);
      }

      /* ===== SEMANTIC ROLES - dark ===== */
      .dark {
        --background: var(--background-900);
        --foreground: var(--text-50);
        --card: var(--background-800);
        --card-foreground: var(--text-50);
        --popover: var(--background-700);

        --secondary: var(--background-800);
        --secondary-foreground: var(--text-50);
        --muted: var(--background-800);

        --accent: var(--background-700);
        --accent-foreground: var(--text-50);
        --destructive: var(--state-error-dark);
        --destructive-foreground: var(--state-error-foreground);
        --success: var(--state-success-dark);
        --success-foreground: var(--state-success-foreground);
        --border: var(--background-700);
        --input: var(--background-700);
        --ring: var(--brand-400);

        --icon: var(--icon-50);
        --icon-muted: var(--icon-500);

        --chart-1: var(--state-success-dark);
        --chart-2: var(--brand-400);
        --chart-3: #ff9f0a;
        --chart-4: #5e5ce6;
        --chart-5: #bf5af2;

        --sidebar: var(--background-800);
        --sidebar-foreground: var(--text-50);
        --sidebar-primary: var(--brand-400);
        --sidebar-primary-foreground: var(--background-900);
        --sidebar-accent: var(--background-700);
        --sidebar-accent-foreground: var(--text-50);
        --sidebar-border: var(--background-700);
        --sidebar-ring: var(--brand-400);

        --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.3);
        --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-sm:
          0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
        --shadow:
          0 2px 4px -1px rgba(0, 0, 0, 0.4), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
        --shadow-md:
          0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
        --shadow-lg:

        --shadow-xl:

          0 8px 16px -8px rgba(0, 0, 0, 0.44);
        --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.6);
      }

                <td class="toggle-cell">
                  <span
                    class="toggle-switch"
                    role="switch"
                    aria-checked="false"
                    aria-label="Virtual Input 1 → Microsoft GS Wavetable Synth"
                    tabindex="0"
                  ></span>

                <td class="toggle-cell">
                  <span
                    class="toggle-switch"

                    aria-checked="false"
                    aria-label="Virtual Input 1 → LoopMIDI Port A"
                    tabindex="0"
                  ></span>

                <td class="toggle-cell">

                    class="toggle-switch"
                    role="switch"
                    aria-checked="false"
                    aria-label="Virtual Input 1 → LoopMIDI Port B"

                  <span
                    class="toggle-switch disabled"

                    aria-checked="false"
                    aria-disabled="true"

          <div class="flow-canvas">

              <text

                text-anchor="middle"
                class="flow-node-sub"
                style="
                  font-size: 11px;
                  font-weight: 600;

                  letter-spacing: 0.05em;
                  fill: var(--apple-muted-foreground);
                "
              >
                输入设备
              </text>
              <text
                x="680"
                y="24"
                text-anchor="middle"

                  font-size: 11px;
                  font-weight: 600;

                  letter-spacing: 0.05em;
                  fill: var(--apple-muted-foreground);
                "
              >
                输出设备
              </text>

              <!-- K-25 → Microsoft GS (active) -->

                class="flow-edge active"
                d="M 200 80 C 350 80, 450 80, 600 80"

                points="595,75 605,80 595,85"
              />

              <path
                class="flow-edge active"

              />

                class="flow-edge-arrow active"
                points="595,155 605,160 595,165"
              />
              <!-- K-25 → LoopMIDI B (inactive) -->
              <path class="flow-edge" d="M 200 80 C 350 80, 450 240, 600 240" />
              <polygon
                class="flow-edge-arrow"
                points="595,235 605,240 595,245"
              />

              <!-- Launchpad → LoopMIDI B (active) -->
              <path
                class="flow-edge active"
                d="M 200 200 C 350 200, 450 240, 600 240"
              />
              <polygon
                class="flow-edge-arrow active"
                points="595,235 605,240 595,245"
              />

              <!-- Virtual Input 1 → Microsoft GS (active) -->
              <path
                class="flow-edge active"
                d="M 200 320 C 350 320, 450 80, 600 80"
              />
              <polygon
                class="flow-edge-arrow active"
                points="595,75 605,80 595,85"
              />
              <!-- Virtual Input 1 → LoopMIDI A (active) -->
              <path
                class="flow-edge active"
                d="M 200 320 C 350 320, 450 160, 600 160"
              />
              <polygon
                class="flow-edge-arrow active"
                points="595,155 605,160 595,165"
              />
              <!-- Virtual Input 1 → Virtual Output 1 (inactive, dashed) -->
              <path
                class="flow-edge"
                d="M 200 320 C 350 320, 450 400, 600 400"
                stroke-dasharray="4 4"
              />
              <polygon
                class="flow-edge-arrow"
                points="595,395 605,400 595,405"
              />

              <!-- Input Nodes (left column) -->
              <g class="flow-node-group">
                <rect
                  class="flow-node flow-node-input"
                  x="40"
                  y="60"
                  width="160"
                  height="40"
                  rx="12"
                  ry="12"
                />
                <circle cx="58" cy="80" r="4" fill="var(--apple-success)" />
                <text x="70" y="78" class="flow-node-label">
                  MIDI Keyboard K-25
                </text>
                <text x="70" y="92" class="flow-node-sub">输入 · 已连接</text>
              </g>
              <g class="flow-node-group">
                <rect
                  class="flow-node flow-node-input"

                  width="160"
                  height="40"
                  rx="12"
                  ry="12"
                />
                <circle cx="58" cy="200" r="4" fill="var(--apple-success)" />
                <text x="70" y="198" class="flow-node-label">

                </text>
                <text x="70" y="212" class="flow-node-sub">输入 · 已连接</text>
              </g>
              <g class="flow-node-group">
                <rect
                  class="flow-node flow-node-input"
                  x="40"
                  y="300"
                  width="160"
                  height="40"
                  rx="12"
                  ry="12"
                />
                <circle cx="58" cy="320" r="4" fill="var(--apple-success)" />
                <text x="70" y="318" class="flow-node-label">
                  Virtual Input 1
                </text>
                <text x="70" y="332" class="flow-node-sub">
                  虚拟输入 · 已连接
                </text>
              </g>

              <!-- Output Nodes (right column) -->
              <g class="flow-node-group">

                <text x="630" y="92" class="flow-node-sub">输出 · 已连接</text>
              </g>
              <g class="flow-node-group">
                <rect
                  class="flow-node flow-node-output"
                  x="600"
                  y="140"
                  width="160"
                  height="40"
                  rx="12"
                  ry="12"
                />
                <circle cx="618" cy="160" r="4" fill="var(--apple-success)" />
                <text x="630" y="158" class="flow-node-label">
                  LoopMIDI Port A
                </text>
                <text x="630" y="172" class="flow-node-sub">输出 · 已连接</text>
              </g>
              <g class="flow-node-group">
                <rect
                  class="flow-node flow-node-output"

                  y="220"
                  width="160"
                  height="40"

                  ry="12"
                />

              </g>
              <g class="flow-node-group">
