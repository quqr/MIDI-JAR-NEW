/*
 * Pinguo design tokens — project-local supplement
 * Source: Apple Design Library (dl_builtin_apple) colors_and_type.css
 * Supplement: semantic radius/shadow/spacing aliases for apply-html-head-contract.mjs
 * The Library CSS is read-only; this file extends it with required semantic aliases.
 * All primitive and semantic tokens are inherited from the Library source below.
 */

:root {
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff;
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759;
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30;
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: "DM Sans", ui-sans-serif, sans-serif, system-ui;
  --font-serif: "DM Sans", ui-sans-serif, sans-serif, system-ui;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --tracking-normal: 0em;

  /* RADIUS — Apple HIG continuous corner scale */
  --radius: 1.2rem;
  --apple-radius-sm: 0.5rem;      /* 8px — inputs, labels, small controls */
  --apple-radius-md: 0.75rem;     /* 12px — buttons, medium elements */
  --apple-radius-lg: 1.2rem;      /* 19.2px — cards, containers (matches --radius) */
  --apple-radius-xl: 1.75rem;     /* 28px — hero sections, large panels */
  --apple-radius-full: 9999px;    /* pill-shaped buttons, avatars */

  /* SHADOWS — whisper-light elevation */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12);
  --apple-shadow-sm: var(--shadow-sm);
  --apple-shadow-md: var(--shadow-md);
  --apple-shadow-lg: var(--shadow-lg);
  --apple-shadow-xl: var(--shadow-xl);

  /* SPACING */
  --spacing: 0.24rem;
  --apple-spacing: var(--spacing);

  /* MOTION — Apple HIG easing and timing */
  --ease-hig-standard: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-hig-decelerate: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-hig-accelerate: cubic-bezier(0.3, 0, 0.5, 1);
  --hig-duration-fast: 150ms;
  --hig-duration-normal: 250ms;
  --hig-duration-slow: 350ms;
  --apple-ease: var(--ease-hig-standard);
  --apple-duration-fast: var(--hig-duration-fast);
  --apple-duration-normal: var(--hig-duration-normal);
  --apple-duration-slow: var(--hig-duration-slow);

  /* STATUS COLORS — Apple HIG system colors */
  --hig-success: var(--state-success);
  --hig-warning: #ff9500;
  --hig-error: var(--state-error);
  --hig-info: var(--brand-500);
  --apple-success: var(--state-success);
  --apple-warning: #ff9500;
  --apple-error: var(--state-error);
  --apple-info: var(--brand-500);
}

/* ===== SEMANTIC ROLES - dark ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    <style>

      /* ===== Footer ===== */
      .midi-footer { border-top: 1px solid var(--apple-border); }

      /* ===== Chord display — upper area ===== */
      .chord-stage {
        background-color: var(--apple-card);
        border: 1px solid var(--apple-border);
        border-radius: var(--apple-radius-lg);
        box-shadow: var(--shadow-sm);
      }

      /* ===== Glass floating panel (alt chords + sound toggle) ===== */
      .glass-panel {
        background: color-mix(in srgb, var(--apple-card) 80%, transparent);
        backdrop-filter: blur(12px) saturate(160%);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
        border: 1px solid color-mix(in srgb, var(--apple-border) 60%, transparent);
        border-radius: var(--apple-radius-md);
        box-shadow: var(--shadow-md);
      }
      .alt-chord-pill {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.75rem;
        border-radius: var(--apple-radius-full);
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 500;
        background-color: var(--apple-muted);
        color: var(--apple-foreground);
        cursor: pointer;
        transition: background-color var(--hig-duration-fast) var(--ease-hig-standard);
      }
      .alt-chord-pill:hover { background-color: var(--apple-accent); }
      .alt-chord-pill:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--apple-ring) 50%, transparent);
      }

      /* ===== Intervals grid ===== */
      .interval-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 2.25rem;
        border-radius: var(--apple-radius-sm);
        font-size: 0.8125rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        background-color: var(--apple-muted);
        color: var(--apple-muted-foreground);
        transition: background-color var(--hig-duration-fast) var(--ease-hig-standard);
      }
      .interval-cell--active {
        background-color: var(--apple-primary);
        color: var(--apple-primary-foreground);
      }

      /* ===== Piano keyboard (CSS-only) ===== */
      .piano-keyboard {
        position: relative;
        display: flex;
        height: 100%;
        user-select: none;
      }
      .piano-white-key {
        flex: 1;
        background-color: var(--apple-background);
        border: 1px solid var(--apple-border);
        border-radius: 0 0 var(--apple-radius-sm) var(--apple-radius-sm);
        position: relative;
        cursor: pointer;
        transition: background-color var(--hig-duration-fast) var(--ease-hig-standard), transform var(--hig-duration-fast) var(--ease-hig-standard);
      }
      .piano-white-key:hover { background-color: var(--apple-muted); }
      .piano-white-key:active { transform: translateY(1px); }
      .piano-white-key--active {
        background-color: var(--apple-primary);
        box-shadow: 0 0 12px color-mix(in srgb, var(--apple-primary) 40%, transparent);
        animation: key-pulse 2s var(--ease-hig-standard) infinite;
      }
      .piano-white-key--active:hover { background-color: var(--apple-primary); }
      .piano-black-key {
        position: absolute;
        width: calc(100% / 14 * 0.6);
        height: 60%;
        background-color: var(--apple-foreground);
        border-radius: 0 0 var(--apple-radius-sm) var(--apple-radius-sm);
        z-index: 2;
        cursor: pointer;
        transition: background-color var(--hig-duration-fast) var(--ease-hig-standard), transform var(--hig-duration-fast) var(--ease-hig-standard);
      }
      .piano-black-key:hover { background-color: var(--apple-muted-foreground); }
      .piano-black-key:active { transform: translateY(1px); }
      .piano-black-key--active {
        background-color: var(--apple-primary);
        box-shadow: 0 0 12px color-mix(in srgb, var(--apple-primary) 40%, transparent);
        animation: key-pulse 2s var(--ease-hig-standard) infinite;
      }
      .piano-key-label {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--apple-primary-foreground);
        pointer-events: none;
      }

      /* ===== Animations ===== */
      @keyframes chord-enter {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .chord-name-display {
        animation: chord-enter 0.6s var(--ease-hig-decelerate) both;
      }

      @keyframes interval-enter {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .interval-cell {
        animation: interval-enter var(--hig-duration-normal) var(--ease-hig-standard) both;
      }
      .interval-cell:nth-child(1)  { animation-delay: 0ms; }
      .interval-cell:nth-child(2)  { animation-delay: 50ms; }
      .interval-cell:nth-child(3)  { animation-delay: 100ms; }
      .interval-cell:nth-child(4)  { animation-delay: 150ms; }
      .interval-cell:nth-child(5)  { animation-delay: 200ms; }
      .interval-cell:nth-child(6)  { animation-delay: 250ms; }
      .interval-cell:nth-child(7)  { animation-delay: 300ms; }
      .interval-cell:nth-child(8)  { animation-delay: 350ms; }
      .interval-cell:nth-child(9)  { animation-delay: 400ms; }
      .interval-cell:nth-child(10) { animation-delay: 450ms; }
      .interval-cell:nth-child(11) { animation-delay: 500ms; }
      .interval-cell:nth-child(12) { animation-delay: 550ms; }

      @keyframes key-pulse {
        0%, 100% {
          box-shadow: 0 0 12px color-mix(in srgb, var(--apple-primary) 40%, transparent);
        }
        50% {
          box-shadow: 0 0 20px color-mix(in srgb, var(--apple-primary) 65%, transparent);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .chord-name-display,
        .interval-cell,
        .piano-white-key--active,
        .piano-black-key--active {
          animation: none;
        }
        .piano-white-key,
        .piano-black-key,
        .alt-chord-pill {
          transition: none;
        }
      }

      /* ===== Settings Sidebar ===== */
      .settings-drawer {
        position: fixed;
        top: 52px;
        right: 0;
        bottom: 0;

        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-left: 1px solid var(--apple-border);

      .settings-drawer-body {

      .settings-row-label {
        font-size: 0.8125rem;
        color: var(--apple-foreground);
      }
      .settings-row-desc {
        font-size: 0.6875rem;
        color: var(--apple-muted-foreground);

      }
      .settings-backdrop {
        position: fixed;
        inset: 0;
        top: 52px;
        background-color: rgba(0, 0, 0, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--hig-duration-normal) var(--ease-hig-standard);
        z-index: 39;
      }
      .settings-backdrop.open { opacity: 1; pointer-events: auto; }

    <script>lucide.createIcons();</script>
    <script>
      (function() {
        var drawer = document.getElementById('settings-drawer');
        var backdrop = document.getElementById('settings-backdrop');
        var toggle = document.getElementById('settings-toggle');
        var close = document.getElementById('settings-close');
        function open() { drawer.classList.add('open'); backdrop.classList.add('open'); toggle.setAttribute('aria-expanded','true'); }
        function shut() { drawer.classList.remove('open'); backdrop.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); }
        toggle.addEventListener('click', function() { drawer.classList.contains('open') ? shut() : open(); });
        close.addEventListener('click', shut);
        backdrop.addEventListener('click', shut);
      })();
    </script>
